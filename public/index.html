<style>
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}

body{font-family:'Poppins',system-ui,sans-serif;background:#cfe6f5;color:#fff;overflow:hidden;-webkit-tap-highlight-color:transparent}

.panel{position:fixed;inset:0;margin:auto;width:min(92vw,420px);height:fit-content;display:flex;flex-direction:column;gap:12px;text-align:center;padding:26px;z-index:10}
h1{font:44px 'Bungee',Impact,sans-serif;line-height:1;color:#fff;text-shadow:0 4px 0 #d32f2f}h1 span{color:#ffd740}

.sub,.panel small{opacity:.75;font-size:13px}

input{font:700 16px 'Poppins',sans-serif;padding:12px 14px;border-radius:12px;border:2px solid #2c3a72;background:#0d1530;color:#fff;text-align:center;outline:0;width:100%}input:focus{border-color:#ffd740}
.btn{font:700 15px 'Poppins',sans-serif;border:0;border-radius:14px;padding:12px 20px;color:#fff;cursor:pointer;background:linear-gradient(135deg,#ff416c,#ff4b2b);box-shadow:0 6px 0 #9b1c2e,0 12px 20px #0006;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #9b1c2e}
.btn.g{background:linear-gradient(135deg,#11998e,#38ef7d);box-shadow:0 6px 0 #0b6b5f,0 12px 20px #0006}
.btn.b{background:linear-gradient(135deg,#2193b0,#6dd5ed);box-shadow:0 6px 0 #14677e,0 12px 20px #0006;color:#06222c}

/* ruang tunggu */
.codebox{font:15px 'Poppins';opacity:.9}.codebox span{display:block;font:46px 'Bungee',Impact,sans-serif;color:#ffd740;letter-spacing:6px;line-height:1.1}
#rpl{display:flex;flex-direction:column;gap:6px}

.rp i{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:0 0 0 2px #fff4}.rp em{margin-left:auto;font-style:normal;font-size:11px;opacity:.85}.rp.empty{opacity:.45;font-style:italic}
.wait{padding:10px 14px;font-size:13px;text-align:center}
/* HUD */
#hud{position:fixed;left:12px;top:12px;width:262px;display:flex;flex-direction:column;gap:6px;z-index:5}
.pl{position:relative;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:#0e1634cc;border:1px solid #ffffff22;font-size:13px;backdrop-filter:blur(8px)}
.pl.on{background:#ffd74040;outline:2px solid #ffd740}.pl.dead{opacity:.5}.pl i{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 0 2px #fff5}
.pl .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pl .pp{font-size:11px;opacity:.8;margin-left:auto}.pl b{color:#7dffb0;white-space:nowrap}
.chg{position:absolute;right:10px;top:-4px;font:700 13px 'Poppins';text-decoration:none;animation:chg 1.8s forwards;pointer-events:none;text-shadow:0 2px 4px #000a}
.chg.up{color:#69f0ae}.chg.dn{color:#ff8a80}@keyframes chg{0%{opacity:0;transform:translateY(8px)}15%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
#lg{position:fixed;left:12px;bottom:12px;width:310px;max-width:45vw;font-size:12px;line-height:1.5;max-height:200px;overflow:hidden;z-index:4}
#lg div{opacity:.6}#lg div:last-child{opacity:1;font-weight:700}
#top{position:fixed;top:12px;left:50%;transform:translateX(-50%);text-align:center;padding:10px 22px;z-index:5;white-space:nowrap}
#top .tt{font-weight:700;font-size:16px}#top .meta{font-size:11px;opacity:.8;margin-top:2px}.you{color:#ffd740}
#bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;width:min(96vw,760px);z-index:6;pointer-events:none}
#bar>*{pointer-events:auto}#bar>div{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.bubble{padding:8px 16px;border-radius:14px;font-size:13px;background:#0e1634dd;border:1px solid #ffffff30}.bubble b{color:#ffd740}
.jailb{padding:6px 14px;border-radius:12px;background:#e65100dd;font-weight:700;font-size:13px}
/* toolbar */
#tools{position:fixed;top:12px;right:12px;display:flex;gap:8px;z-index:8}
.tb{width:42px;height:42px;border-radius:50%;border:1px solid #ffffff33;background:#0e1634cc;color:#fff;font-size:18px;cursor:pointer;backdrop-filter:blur(8px)}.tb:hover{background:#243a7a}.tb.off{opacity:.45}
/* dadu */
#dice{position:fixed;inset:0;display:flex;gap:18px;justify-content:center;align-items:center;pointer-events:none;opacity:0;transition:opacity .5s;z-index:15}
#dice.show{opacity:1;transition:none}
.die{width:76px;height:76px;border-radius:16px;background:#fff;padding:10px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);box-shadow:0 8px 0 #bbb,0 16px 28px #0008}
.die s{border-radius:50%;margin:2px}.die s.on{background:#222}
#dice.show:not(.done) .die{animation:shake .16s infinite}#dice.done .die{background:#fff4c4;animation:land .3s}
@keyframes shake{0%{transform:rotate(-14deg) translateY(-8px)}50%{transform:rotate(12deg) translateY(4px)}100%{transform:rotate(-14deg) translateY(-8px)}}
@keyframes land{0%{transform:scale(1.4)}100%{transform:scale(1)}}
/* kartu */
#card{position:fixed;inset:0;display:grid;place-items:center;background:#0006;z-index:20;perspective:900px}
.cd{width:min(80vw,300px);min-height:380px;border-radius:22px;padding:22px 20px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;box-shadow:0 24px 60px #000a,inset 0 0 0 6px #ffffff55;animation:cin .7s cubic-bezier(.2,1.2,.3,1)}
.cd.chance{background:linear-gradient(160deg,#ffe082,#ffb300 60%,#ff8f00);color:#4a2c00}
.cd.risk{background:linear-gradient(160deg,#b39ddb,#7e57c2 55%,#4527a0);color:#fff}
.ch{font:20px 'Bungee',Impact,sans-serif;letter-spacing:1px}.cm{font:110px 'Bungee',Impact,sans-serif;line-height:1;opacity:.35}
.ct{font-weight:700;font-size:17px;line-height:1.35}.cn{font-size:12px;opacity:.75}
@keyframes cin{0%{transform:translateY(120px) rotateY(100deg) scale(.5);opacity:0}100%{transform:none;opacity:1}}
/* drawer & info */
#drawer{position:fixed;right:12px;top:66px;width:min(92vw,340px);max-height:70vh;overflow:auto;z-index:30}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.x{background:#ffffff22;border:0;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer}
.ar{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #ffffff1c}.ar>i{width:12px;height:30px;border-radius:4px;flex:none}.ai{flex:1;min-width:0;font-size:13px}.ai small{display:block;opacity:.7;font-size:11px}
.lock,.mx{font-size:11px;opacity:.8}.empty{font-size:13px;opacity:.7;padding:10px 0}.dn{display:block;opacity:.6;margin-top:8px;font-size:11px}
#tinfo{position:fixed;right:12px;bottom:90px;width:min(88vw,250px);z-index:12;font-size:13px;line-height:1.5}
#tinfo .tbar{height:10px;border-radius:6px;margin-bottom:8px}#tinfo b{font-size:15px}#tinfo .row{display:flex;justify-content:space-between;opacity:.9}
/* game over */
#over{position:fixed;inset:0;display:grid;place-items:center;background:#0008;z-index:40}
.ov{width:min(92vw,380px);text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}.trophy{font-size:64px}.ov h2{color:#ffd740;font-size:28px}
.fin{width:100%;font-size:13px;text-align:left}.fin div{display:flex;justify-content:space-between;padding:5px 8px;border-radius:8px;background:#ffffff12;margin-bottom:4px}
.cfbox{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}.cfbox i{position:absolute;top:-20px;width:9px;height:14px;animation:fall linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#toast{position:fixed;top:78px;left:50%;transform:translateX(-50%) translateY(-10px);background:#d32f2f;padding:10px 18px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.3s;z-index:60;pointer-events:none;text-align:center;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
#conn{position:fixed;bottom:0;left:0;right:0;background:#f57c00;color:#fff;text-align:center;padding:6px;font-size:13px;font-weight:700;z-index:70}
@media(max-width:700px){
 #hud{left:8px;right:8px;top:8px;width:auto;flex-direction:row;gap:4px}
 .pl{flex:1;min-width:0;flex-direction:column;align-items:flex-start;gap:1px;padding:5px 7px;font-size:10.5px}.pl i{position:absolute;right:6px;top:6px;width:9px;height:9px}.pl .pp{margin-left:0}
 .chg{right:4px;top:auto;bottom:-6px}
 #top{top:82px;padding:6px 12px}#top .tt{font-size:13px}#top .meta{display:none}
 #tools{top:124px;right:8px;flex-direction:column}.tb{width:38px;height:38px;font-size:16px}
 #lg{display:none;left:8px;bottom:auto;top:130px;max-width:70vw}#lg.alt{display:block}
 #drawer{left:8px;right:8px;top:auto;bottom:10px;width:auto;max-height:55vh}
 #tinfo{bottom:150px}.btn{padding:10px 14px;font-size:13px}h1{font-size:38px}
}
@media(min-width:701px){#lg.alt{display:none}}
</style></head><body>

<div id="lobby" class="glass panel"><h1>KASUS<span>POLY</span></h1><p class="sub">Monopoli satire Indonesia · 2–4 pemain online</p>
<input id="nm" placeholder="Nama kamu" maxlength="12" autocomplete="off"><button class="btn" id="cr">Buat Ruangan</button>
<div class="or">— atau masuk dengan kode —</div>
<input id="cd" placeholder="KODE" maxlength="4" autocomplete="off" style="text-transform:uppercase"><button class="btn b" id="jn">Gabung Ruangan</button>
<small>🎵 Musik &amp; efek suara aktif setelah kamu klik sesuatu</small></div>

<div id="room" class="glass panel" hidden><h2>Ruang Tunggu</h2>
<div class="codebox">Kode ruangan<span id="rcode"></span></div>
<div><button class="btn sm b" data-a="copy">📋 Salin Link Undangan</button></div>
<div id="rpl"></div><div id="ract"></div></div>

<div id="game" hidden><div id="hud"></div><div id="lg" class="glass"></div><div id="top" class="glass"></div><div id="bar"></div></div>
<div id="tools"><button class="tb" data-a="music" id="tmusic" title="Musik">🎵</button><button class="tb" data-a="sfx" id="tsfx" title="Efek suara">🔊</button><button class="tb need" data-a="log" title="Riwayat">📜</button><button class="tb need" data-a="drawer" title="Aset">🏠</button><button class="tb need" data-a="leave" title="Keluar">🚪</button></div>
<div id="drawer" class="glass" hidden></div>
<div id="tinfo" class="glass" hidden></div>
<div id="dice"><div class="die" id="d1"></div><div class="die" id="d2"></div></div>
<div id="card" hidden></div>
<div id="over" hidden></div>
<div id="toast"></div>
<div id="conn" hidden>📶 Menyambung ulang ke server…</div>

<script>
(function(){
'use strict';
function start(){
if(typeof io==='undefined'){alert('Socket.io gagal dimuat. Pastikan server jalan (npm start) dan buka lewat http://localhost:3000');return}
const $=id=>document.getElementById(id);
const LS={g(k){try{return localStorage.getItem(k)}catch(e){return null}},s(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const SS={g(k){try{return sessionStorage.getItem(k)}catch(e){return null}},s(k,v){try{if(v==null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(e){}}};
const rd=x=>Math.round(x*10)/10,fm=n=>'Rp'+rd(n)+'jt';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// ID pemain (per tab) — INI yang dulu hilang sehingga muncul "ID pemain tidak valid"
let PID=SS.g('kp_pid');
if(!PID||PID.length<8){PID=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():('p'+Math.random().toString(36).slice(2)+Date.now().toString(36));SS.s('kp_pid',PID)}

/* ================= AUDIO: musik bergaya gamelan + efek suara (tanpa file, semua disintesis) ================= */
const Aud=(function(){
 let ac=null,musG,sfxG,delay,next=0,bar=0,stp=0,mi=3;
 let mOn=LS.g('kp_m')!=='0',sOn=LS.g('kp_s')!=='0';
 const E=60/88/2,F=n=>261.63*Math.pow(2,n/12),SC=[0,2,4,7,9],ROOTS=[0,-3,-5,-3];
 function init(){
  if(ac){if(ac.state==='suspended')ac.resume();return}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  ac=new C();const master=ac.createGain();master.gain.value=.9;master.connect(ac.destination);
  musG=ac.createGain();musG.gain.value=mOn?.55:0;musG.connect(master);
  sfxG=ac.createGain();sfxG.gain.value=sOn?1:0;sfxG.connect(master);
  delay=ac.createDelay(1);delay.delayTime.value=E*3;
  const fb=ac.createGain();fb.gain.value=.38;const wet=ac.createGain();wet.gain.value=.45;
  delay.connect(fb);fb.connect(delay);delay.connect(wet);wet.connect(musG);
  next=ac.currentTime+.15;setInterval(sched,100)}
 function tone(t,fr,v,d,type,att){const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=fr;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+(att||.02));g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(musG);o.start(t);o.stop(t+d+.05)}
 function bell(t,fr,v,d){const g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  [[1,1],[2.76,.28],[5.4,.1]].forEach(a=>{const o=ac.createOscillator(),h=ac.createGain();o.frequency.value=fr*a[0];h.gain.value=a[1];o.connect(h);h.connect(g);o.start(t);o.stop(t+d+.05)});
  g.connect(musG);g.connect(delay)}
 function play(t){const r=ROOTS[bar%4];
  if(stp===0){tone(t,F(r-24),.25,E*7.6,'sine',.05);[0,7,12].forEach(iv=>tone(t,F(r-12+iv),.06,E*8,'triangle',.4))}
  if(stp===0||stp===4)bell(t,F(r-12),.12,1.4);
  if((stp%2===0&&Math.random()<.7)||Math.random()<.22){mi=Math.max(0,Math.min(9,mi+[-2,-1,-1,0,1,1,2][Math.floor(Math.random()*7)]));bell(t,F(SC[mi%5]+12*Math.floor(mi/5)+12),.07,1.1)}
  stp++;if(stp>=8){stp=0;bar++}}
 function sched(){if(!ac)return;if(next<ac.currentTime-1)next=ac.currentTime+.1;while(next<ac.currentTime+.35){play(next);next+=E}}
 function blip(fr,t,d,type,v,to){const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(fr,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v||.25,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(sfxG);o.start(t);o.stop(t+d+.05)}
 function noise(t,d,v,fq){const n=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
  const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=fq||1800;const g=ac.createGain();
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(sfxG);s.start(t)}
 const SFX={
  dice(t){for(let i=0;i<10;i++)noise(t+i*.075,.06,.3,1000+Math.random()*1800)},
  coin(t){blip(988,t,.12,'square',.1);blip(1319,t+.08,.4,'square',.1)},
  buy(t){[523,659,784,1047].forEach((f,i)=>blip(f,t+i*.07,.3,'triangle',.22))},
  card(t){noise(t,.25,.35,3200);blip(660,t+.12,.25,'sine',.18);blip(880,t+.22,.3,'sine',.18)},
  ott(t){for(let i=0;i<3;i++){blip(620,t+i*.5,.45,'sawtooth',.13,980);blip(980,t+i*.5+.25,.25,'sawtooth',.09,620)}},
  win(t){[523,659,784,1047,0,784,1047,1319].forEach((f,i)=>{if(f)blip(f,t+i*.15,.45,'triangle',.25)})},
  step(t){blip(280+Math.random()*60,t,.07,'sine',.12)},
  turn(t){blip(880,t,.15,'sine',.2);blip(1175,t+.13,.3,'sine',.2)},
  err(t){blip(200,t,.22,'sawtooth',.13)},
  click(t){blip(520,t,.05,'triangle',.12)}};
 return{init,
  sfx(n){if(!ac||!sOn||!SFX[n])return;SFX[n](ac.currentTime+.01)},
  music(v){mOn=v;LS.s('kp_m',v?'1':'0');if(musG)musG.gain.setTargetAtTime(v?.55:0,ac.currentTime,.1)},
  fx(v){sOn=v;LS.s('kp_s',v?'1':'0');if(sfxG)sfxG.gain.setTargetAtTime(v?1:0,ac.currentTime,.05)},
  get m(){return mOn},get s(){return sOn}}})();
addEventListener('pointerdown',()=>Aud.init());addEventListener('keydown',()=>Aud.init());

/* ================= STATE & SOCKET ================= */
const S=io(window.SERVER_URL||undefined);
let st=null,B=[],G={},auto=false,lastTurn='',prevM={},pend=[],confettiDone=false,cT,tT,dT;
const MULT=[1,5,15,35,55,80],LVN=['Tanah','Rumah 1','Rumah 2','Rumah 3','Rumah 4','Gedung'];
const grpIdx=g=>B.map((t,i)=>t.g===g?i:-1).filter(i=>i>=0);
const me=()=>st&&st.pl.find(p=>p.id===PID),cur=()=>st.pl[st.turn];
const myTurn=()=>!!st&&st.ph!=='lobby'&&st.ph!=='over'&&cur().id===PID;
const myName=()=>{const v=($('nm').value||'').trim()||'Pemain';LS.s('kp_name',v);return v};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2400)}
$('nm').value=LS.g('kp_name')||'';
try{const r=new URLSearchParams(location.search).get('r');if(r)$('cd').value=r.toUpperCase().slice(0,4)}catch(e){}

S.on('connect',()=>{$('conn').hidden=true;const c=SS.g('kp_room');if(c){auto=true;S.emit('join',c,myName(),PID)}});
S.on('disconnect',()=>{$('conn').hidden=false});
S.on('joined',c=>{SS.s('kp_room',c);auto=false});
S.on('gone',()=>{SS.s('kp_room',null);st=null;if(!auto)toast('Ruangan tidak ditemukan');auto=false;ui()});
S.on('err',m=>{if(auto){SS.s('kp_room',null);auto=false}toast(m);Aud.sfx('err')});
S.on('board',d=>{B=d.B;G=d.G;if(!ready){try{init3d()}catch(e){console.error(e);toast('Tampilan 3D gagal dimuat (WebGL?)')}}});
S.on('fx',n=>Aud.sfx(n));
S.on('dice',showDice);
S.on('cardshow',c=>{pend.push(c)});
S.on('state',s=>{st=s;ui();sync3d();after()});

$('cr').onclick=()=>{Aud.init();S.emit('create',myName(),PID)};
$('jn').onclick=()=>{Aud.init();const c=$('cd').value.trim();if(c.length<4)return toast('Masukkan kode 4 huruf');S.emit('join',c,myName(),PID)};
$('nm').onkeydown=e=>{if(e.key==='Enter')$('cr').click()};$('cd').onkeydown=e=>{if(e.key==='Enter')$('jn').click()};

const SERVER_ACTS=['start','roll','buy','pass','pay','sogok','end','bail','again'];
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;Aud.init();Aud.sfx('click');const a=b.dataset.a;
 if(SERVER_ACTS.indexOf(a)>=0)return S.emit(a);

  case 'build':S.emit('build',Number(b.dataset.v));break;
